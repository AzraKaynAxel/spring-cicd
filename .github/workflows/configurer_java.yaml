      # Identique à ce qui ce passe au dessus
      - name: Afficher les versions des outils
        run: |
          echo 'Version de java:'
          java -version
          echo 'Version de maven:'
          mvn -version

      - name: Récupérer le code applicatif du dépôt
        uses: actions/checkout@v5

      - name: liste des fichiers après opérations
        run: ls -al

