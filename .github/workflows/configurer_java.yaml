name: Configuration Java

on:
  workflow_dispatch:

jobs:
  affichage:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code soure
      - uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Construire avec Maven
        run: mvn -B clean package -DskipTests

      - name: Sauvegarder les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: java-artifact
          path: target/*.jar