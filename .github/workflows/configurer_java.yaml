name: Configuration Java

on:
  push:
    branches: [ "main" ]

jobs:
  configurer:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

