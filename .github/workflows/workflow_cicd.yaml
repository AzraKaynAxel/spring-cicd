name: Mise en place de CodeQL

on:
  push:
    branches: [ "main" ]

jobs:
  codeql:
    runs-on: ubuntu-latest

    steps:
      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Construire avec Maven
        run: mvn -B clean verify -Dspring.profiles.active=test -Dmaven.test.failure.ignore=true

      - name: Analyse avec CodeQL
        uses: github/codeql-action/analyze@v4



